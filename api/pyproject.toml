[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true
# Placeholder/stub functions across the codebase intentionally have `...` bodies
# with no logic yet (see progress.md) — don't flag those as errors.
# Remove this once all stub functions across the codebase are implemented — tracked
# in progress.md Decisions Log.
disable_error_code = ["empty-body"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
